[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spring-microbiome"
version = "1.0.0"
description = "Faithful Python port of SPRING (Semi-Parametric Rank-based approach for INference in Graphical models) for microbiome network estimation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "spring-python contributors" }]
keywords = [
    "microbiome",
    "network-inference",
    "graphical-model",
    "meinshausen-buhlmann",
    "stars",
    "kendall",
    "latent-correlation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.scripts]
spring-microbiome = "spring_microbiome.cli:main"

[project.urls]
"Original R implementation" = "https://github.com/IrinaStatsLab/SPRING"
"Paper" = "https://www.frontiersin.org/articles/10.3389/fgene.2019.00516/full"

[tool.hatch.build.targets.wheel]
packages = ["src/spring_microbiome"]

[tool.hatch.build.targets.wheel.force-include]
"src/spring_microbiome/latentcor/data/ipol_22.npz" = "spring_microbiome/latentcor/data/ipol_22.npz"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E741", "B905", "N803", "N806"]
"docs/**" = ["D"]
# The public API deliberately mirrors the R package, where the parameter names
# (Rmethod, use_nearPD, Rtol) and the mathematical single-letter matrix names
# (K, R, S, Q, X) do not follow Python naming conventions.
"src/spring_microbiome/**" = ["N803", "N806", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that require the R golden data (may be slow)",
]
